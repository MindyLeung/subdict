<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subly</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="desktop-guard">
      <h1>Subly</h1>
      <p>Subly MVP 目前专为桌面端设计。请在更宽的屏幕上打开。</p>
    </div>

    <main class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Subly">
          Sub<span>ly</span>
        </div>

        <div class="file-chip" id="fileName">视频文件名.mp4</div>

        <label class="select-wrap" aria-label="目标语言">
          <span class="select-icon">文</span>
          <select id="languageSelect">
            <option value="ja">日本語</option>
            <option value="en">English</option>
          </select>
        </label>

        <div class="topbar-spacer"></div>

        <button class="ghost-button" id="themeToggle" type="button" title="切换明暗主题">
          <span id="themeIcon">☾</span>
          <span id="themeLabel">深青绿</span>
        </button>
        <button class="ghost-button" id="exportDictationBtn" type="button">
          <span>↓</span>
          导出听写
        </button>
        <button class="ghost-button" id="openNotebookBtn" type="button">
          <span>▣</span>
          笔记本 <span id="noteCount">(0)</span>
        </button>
        <label class="primary-button">
          <span>↑</span>
          导入视频
          <input id="videoInput" type="file" accept="video/*,.mp4,.m4v,.mov,.webm,.mkv,.avi" hidden />
        </label>
      </header>

      <section class="workspace" aria-label="Subly 工作区">
        <div class="left-pane">
          <section class="video-card" aria-label="视频播放器">
            <div class="video-stage" id="videoStage">
              <video id="video" class="video-el"></video>
              <div class="empty-video" id="emptyVideo">
                <div class="play-mark">▷</div>
                <strong>视频画面区域</strong>
                <span>导入本地视频后开始听写</span>
              </div>
              <div class="subtitle-mask" id="subtitleMask">
                <button class="mask-handle" id="maskHandle" type="button" title="拖动调节遮罩高度"></button>
                <span class="mask-label">字幕遮罩</span>
              </div>
              <div class="mask-tip">↕ 拖动调节遮罩高度</div>
            </div>

            <div class="player-controls">
              <button class="icon-button" id="backBtn" type="button" title="快退 5 秒">|‹</button>
              <button class="icon-button" id="playBtn" type="button" title="播放/暂停">▶</button>
              <button class="icon-button" id="forwardBtn" type="button" title="快进 5 秒">›|</button>
              <input id="seekBar" class="seek-bar" type="range" min="0" max="100" value="0" />
              <span class="time-readout" id="timeReadout">00:00 / 00:00</span>
              <button class="speed-button" id="speedBtn" type="button">1x</button>
              <button class="mask-toggle" id="maskToggle" type="button">遮罩开</button>
            </div>
          </section>

          <section class="dictation-card" aria-label="听写记录">
            <div class="section-header">
              <div>
                <span class="header-icon">⌨</span>
                <strong>听写记录</strong>
                <span id="recordCount">已记录 0 条</span>
              </div>
              <span>选中文字可查词</span>
            </div>

            <div class="records" id="recordsList"></div>

            <form class="dictation-input-row" id="dictationForm">
              <span class="input-prefix">I</span>
              <input id="dictationInput" autocomplete="off" placeholder="听到了什么，输入后按 Enter 记录..." />
              <button type="submit">↵ Enter</button>
            </form>
          </section>
        </div>

        <aside class="side-panel" aria-label="查词和笔记本">
          <div class="tabs">
            <button class="tab active" id="lookupTab" type="button">查词 / 语法</button>
            <button class="tab" id="notebookTab" type="button">笔记本</button>
          </div>

          <section class="panel-view active" id="lookupView">
            <div class="selected-card">
              <span>选中的词：</span>
              <strong id="selectedText">お腹が空いた</strong>
            </div>

            <article class="lookup-card" id="lookupCard">
              <div class="lookup-title-row">
                <div>
                  <h2 id="lookupWord">お腹が空いた</h2>
                  <p id="lookupReading">おなかがすいた</p>
                </div>
                <span class="tag" id="lookupTag">惯用表达</span>
              </div>
              <p id="lookupMeaning">肚子饿了。「空く」表示空、饿，形容持续描述当前状态。</p>
              <button class="save-note" id="saveNoteBtn" type="button">♡ 收藏到笔记本</button>
            </article>

            <article class="grammar-card" id="grammarCard">
              <h3 id="grammarTitle">〜たな（语法）</h3>
              <p id="grammarMeaning">た形 + 终助词な，表示说话者对某状态的自言自语或轻微感叹。</p>
            </article>
          </section>

          <section class="panel-view" id="notebookView">
            <div class="notebook-list" id="notebookList"></div>
          </section>
        </aside>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
